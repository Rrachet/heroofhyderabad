<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta name="theme-color" content="#faf8f2" media="(prefers-color-scheme: light)"/><meta name="theme-color" content="#071d3b" media="(prefers-color-scheme: dark)"/><meta name="color-scheme" content="light dark"/><meta name="description" content="Heroes of Hyderabad — celebrating the people who make Hyderabad what it is."/><title>Heroes of Hyderabad | Triumphs of Talent</title><link rel="stylesheet" href="/src/theme.css"/><script>(function(){try{var t=localStorage.getItem('hohyd-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;window.addEventListener('DOMContentLoaded',function(){var b=document.createElement('button');b.id='themeToggle';b.type='button';b.setAttribute('aria-label','Toggle light and dark theme');b.textContent=t==='dark'?'☀':'☾';document.body.appendChild(b);b.addEventListener('click',function(){var next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('hohyd-theme',next);b.textContent=next==='dark'?'☀':'☾'});});}catch(e){}})();</script></head><body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body></html>
